<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Verification Modal</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f3f2ef;margin:0;padding:0}
.verify-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:1000;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity 0.2s ease}
.verify-overlay.open{opacity:1;pointer-events:all}
.verify-modal{background:#fff;border-radius:12px;padding:28px 32px 24px;width:480px;max-width:90vw;position:relative;transform:translateY(10px);transition:transform 0.2s ease;box-shadow:0 8px 32px rgba(0,0,0,0.2)}
.verify-overlay.open .verify-modal{transform:translateY(0)}
.verify-close{position:absolute;top:14px;right:16px;border:0;background:transparent;font-size:22px;color:#666;cursor:pointer;line-height:1;padding:4px 8px;border-radius:50%;font-family:inherit}
.verify-close:hover{background:#f3f2ef;color:#191919}
.verify-title{font-size:20px;font-weight:700;color:#191919;margin:0 0 20px}
.verify-section-head{font-size:17px;font-weight:700;color:#191919;margin:18px 0 14px;display:flex;align-items:center;gap:6px}
.verify-row{margin-bottom:12px}
.verify-row strong{font-size:14px;font-weight:600;color:#191919;display:block;margin-bottom:1px}
.verify-row span{font-size:14px;color:#555}
.verify-item{display:flex;align-items:flex-start;gap:12px;margin-bottom:4px}
.verify-item-icon{width:36px;height:36px;border-radius:6px;background:#1a1a1a;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.verify-item-text strong{font-size:14px;font-weight:600;color:#191919;display:block;margin-bottom:2px}
.verify-item-text span{font-size:13px;color:#555}
.verify-link{color:#0a66c2;font-size:14px;text-decoration:none;display:block;margin-top:14px}
.verify-link:hover{text-decoration:underline}
.verify-footer{display:flex;justify-content:flex-end;margin-top:24px}
.verify-done{background:#0a66c2;color:#fff;border:0;border-radius:999px;padding:10px 28px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
.verify-done:hover{background:#004182}
</style>
</head>
<body>

<div class="verify-overlay" id="verify-overlay">
  <div class="verify-modal">

    <button class="verify-close" onclick="closeVerifyModal()">&#10005;</button>

    <h2 class="verify-title">About this member</h2>

    <div class="verify-row">
      <strong>Account history</strong>
    </div>
    <div class="verify-row">
      <strong>Joined LinkedIn</strong>
      <span>September 2019</span>
    </div>
    <div class="verify-row">
      <strong>Contact info</strong>
      <span>Updated less than a month ago</span>
    </div>
    <div class="verify-row">
      <strong>Profile photo</strong>
      <span>Updated less than a month ago</span>
    </div>

    <div class="verify-section-head">
      Verifications
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
        <path d="M12 2L4 5.5V11c0 5 3.5 9.5 8 11 4.5-1.5 8-6 8-11V5.5L12 2z" fill="#1a1a1a"/>
        <path d="M8.5 12l2.5 2.5 4.5-5" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>

    <div class="verify-item">
      <div class="verify-item-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
          <rect x="2" y="3" width="20" height="18" rx="3" stroke="#fff" stroke-width="1.5" fill="none"/>
          <path d="M2 8h20M8 3v5M16 3v5" stroke="#aaa" stroke-width="1.2"/>
          <path d="M6 13h4M6 16h8" stroke="#fff" stroke-width="1.4" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="verify-item-text">
        <strong>Yale University</strong>
        <span>Verified using university email in September 2024</span>
      </div>
    </div>

    <a href="#" class="verify-link">Learn more about verifications</a>

    <div class="verify-footer">
      <button class="verify-done" onclick="closeVerifyModal()">Done</button>
    </div>

  </div>
</div>

<script>
function openVerifyModal(){
  document.getElementById('verify-overlay').classList.add('open');
  document.body.style.overflow='hidden';
}
function closeVerifyModal(){
  document.getElementById('verify-overlay').classList.remove('open');
  document.body.style.overflow='';
}
document.getElementById('verify-overlay').addEventListener('click',function(e){
  if(e.target===this) closeVerifyModal();
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape') closeVerifyModal();
});
</script>

</body>
</html>
